name: Build Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      # Material Porter fork: its releases (v4.0.0-mp.1, ...); "-mp.N" keeps FP's updater, which would install
      # upstream FP over the fork, off
      - 'v*-mp.*'

jobs:
  build:
    runs-on: windows-latest
    # Material Porter fork: creates the release (a fork's token is read-only by default)
    permissions:
      contents: write

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      # Material Porter fork: the fixes it carries for FP's CUE4Parse (whole files, laid over the submodule)
      - name: Apply CUE4Parse Overlay
        run: Copy-Item -Path ./patches/CUE4Parse/* -Destination ./external/CUE4Parse -Recurse -Force

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore ./src/FortnitePorting

      - name: Get Version
        shell: bash
        run: echo "FP_VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_ENV

      - name: .NET Publish
        run: |
          dotnet publish ./src/FortnitePorting -c Release --self-contained -r win-x64 -o "./Release" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ env.FP_VERSION }}

      - name: Name Executable
        run: Rename-Item ./Release/FortnitePorting.exe FortnitePortingMP.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FortnitePorting MP ${{ github.ref_name }}"
          files: ./Release/FortnitePortingMP.exe
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
